openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Order placement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place an order
      description: Saves an order and private delivery details, then returns a public confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Invalid order input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderInput:
      type: object
      additionalProperties: false
      required: [items, delivery]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderItemInput"
        couponCode:
          type: string
          enum: [WASL10]
        delivery:
          $ref: "#/components/schemas/DeliveryDetails"
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          minimum: 1
          maximum: 8
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    DeliveryDetails:
      type: object
      additionalProperties: false
      required: [name, phone, governorate, area, block, street, building]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: "^[569][0-9]{7}$"
          description: Eight-digit Kuwait mobile number without country code.
        email:
          type: string
          format: email
          maxLength: 254
        governorate:
          type: string
          enum: [Al Asimah, Hawalli, Al Farwaniyah, Mubarak Al-Kabeer, Al Ahmadi, Al Jahra]
        area:
          type: string
          minLength: 1
          maxLength: 100
        block:
          type: string
          minLength: 1
          maxLength: 40
        street:
          type: string
          minLength: 1
          maxLength: 100
        building:
          type: string
          minLength: 1
          maxLength: 100
        instructions:
          type: string
          maxLength: 500
    OrderConfirmation:
      type: object
      additionalProperties: false
      required: [orderReference, currency, subtotalFils, discountFils, totalFils]
      properties:
        orderReference:
          type: string
          pattern: "^WASL-[A-F0-9-]{36}$"
        currency:
          type: string
          enum: [KWD]
        subtotalFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
        discountFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
        totalFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

