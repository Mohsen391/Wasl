openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Order placement
paths:
  /products:
    get:
      operationId: listProducts
      summary: Database-backed Wasl catalog
      responses:
        "200":
          description: Products, including an empty array when unseeded
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /products/{id}:
    get:
      operationId: getProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verified current identity
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /gifts/{token}:
    get:
      operationId: getGift
      description: Bearer-access gift link. Never includes order IDs, recipient, quantities, prices, user IDs, or delivery details.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
        "200":
          description: Public gift allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicGift" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    get:
      operationId: listMyOrders
      security: [{ bearerAuth: [] }]
      description: Filters exclusively by the authenticated JWT identity; ignores client user IDs.
      responses:
        "200":
          description: Current user's orders only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OwnerOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: placeOrder
      security: [{ bearerAuth: [] }]
      tags: [orders]
      summary: Place an order
      description: Atomically reserves stock and saves a pending order with private delivery details. All prices and totals are server calculated in fils. No payment is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Invalid order input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /orders/{id}/gift-link/revoke:
    post:
      operationId: revokeGiftLink
      security: [{ bearerAuth: [] }]
      tags: [orders]
      summary: Disable an owned gift link
      description: Requires explicit confirmation and the last seen token. Ownership comes only from verified Bearer credentials. Does not change the order.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftLinkInput" }
      responses:
        "200":
          description: Updated private order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerOrder" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /orders/{id}/gift-link/replace:
    post:
      operationId: replaceGiftLink
      security: [{ bearerAuth: [] }]
      tags: [orders]
      summary: Replace or create an owned gift link
      description: Atomically invalidates the old link and issues a fresh random token. A null expectedToken creates a link for a disabled gift. Requires explicit confirmation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftLinkInput" }
      responses:
        "200":
          description: Updated private order with new gift link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerOrder" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Invalid:
      description: Invalid input or rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Invalid or missing credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unavailable:
      description: Database temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    Product:
      type: object
      additionalProperties: false
      required: [id, name, description, price, image, stock, moods, category, features, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0, description: Integer KWD thousandths }
        image: { type: string, format: uri }
        stock: { type: integer, minimum: 0 }
        moods: { type: array, items: { type: string, enum: [Cozy, Energetic, Focus, Celebrate] } }
        category: { type: string }
        features: { type: array, items: { type: string } }
        tag: { type: string }
        createdAt: { type: string, format: date-time }
    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, description: Maximum 72 UTF-8 bytes }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    AuthResult:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token: { type: string, description: HS256 JWT expiring in 7 days }
        user: { $ref: "#/components/schemas/User" }
    PublicGift:
      type: object
      additionalProperties: false
      required: [senderName, giftMessage, giftWrap, items]
      properties:
        senderName: { type: string }
        giftMessage: { type: string, maxLength: 300 }
        giftWrap: { type: string, enum: [Classic, Eid, Birthday, Minimal] }
        items: { type: array, items: { type: string } }
    GiftLinkInput:
      type: object
      additionalProperties: false
      required: [confirmed, expectedToken]
      properties:
        confirmed: { type: boolean, enum: [true] }
        expectedToken: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
    OwnerOrder:
      type: object
      additionalProperties: false
      required: [id, orderReference, items, total, subtotalFils, discountFils, status, createdAt, isGift]
      properties:
        id: { type: string }
        orderReference: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [product, name, price, quantity]
            properties:
              product: { type: string }
              name: { type: string }
              price: { type: integer }
              quantity: { type: integer }
        total: { type: integer }
        subtotalFils: { type: integer }
        discountFils: { type: integer }
        status: { type: string, enum: [pending, paid] }
        createdAt: { type: string, format: date-time }
        isGift: { type: boolean }
        giftToken: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderInput:
      type: object
      additionalProperties: false
      required: [items, delivery]
      properties:
        isGift: { type: boolean, default: false }
        giftTo: { type: string, minLength: 1, maxLength: 80 }
        giftMessage: { type: string, maxLength: 300 }
        giftWrap: { type: string, enum: [Classic, Eid, Birthday, Minimal] }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderItemInput"
        couponCode:
          type: string
          enum: [WASL10]
        delivery:
          $ref: "#/components/schemas/DeliveryDetails"
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    DeliveryDetails:
      type: object
      additionalProperties: false
      required: [name, phone, governorate, area, block, street, building]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          pattern: "^[569][0-9]{7}$"
          description: Eight-digit Kuwait mobile number without country code.
        email:
          type: string
          format: email
          maxLength: 254
        governorate:
          type: string
          enum: [Al Asimah, Hawalli, Al Farwaniyah, Mubarak Al-Kabeer, Al Ahmadi, Al Jahra]
        area:
          type: string
          minLength: 1
          maxLength: 100
        block:
          type: string
          minLength: 1
          maxLength: 30
        street:
          type: string
          minLength: 1
          maxLength: 100
        building:
          type: string
          minLength: 1
          maxLength: 100
        instructions:
          type: string
          maxLength: 500
    OrderConfirmation:
      type: object
      additionalProperties: false
      required: [id, orderReference, currency, subtotalFils, discountFils, totalFils, isGift]
      properties:
        id: { type: string }
        isGift: { type: boolean }
        giftToken: { type: string }
        orderReference:
          type: string
          pattern: "^WASL-[A-F0-9-]{36}$"
        currency:
          type: string
          enum: [KWD]
        subtotalFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
        discountFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
        totalFils:
          type: integer
          minimum: 0
          description: Amount in fils (one thousandth of a Kuwaiti dinar).
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

